name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, lints, docs and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features
      - name: Package audit
        run: |
          package_files="$(mktemp)"
          cargo package --list --allow-dirty > "$package_files"
          if grep -E '^(external|data|target)/' "$package_files"; then
            echo "Ignored inspection/data/build paths must not be packaged." >&2
            exit 1
          fi
          cargo package --allow-dirty

  reference:
    name: Scientific references (${{ matrix.os }}, ${{ matrix.build }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: release
            toolchain: stable
          - os: macos-26
            build: debug
            toolchain: 1.99.0
          - os: macos-26
            build: release
            toolchain: 1.99.0
          - os: macos-26
            build: native
            toolchain: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Record runner arithmetic environment
        shell: bash
        run: |
          if [ '${{ runner.os }}' = macOS ]; then
            test "$(uname -m)" = arm64
          fi
          rustc -vV
          uname -a
      - name: R 4.6.2 and package precision contracts
        shell: bash
        run: |
          build_args=()
          test_args=()
          if [ '${{ matrix.build }}' != debug ]; then
            build_args+=(--release)
          fi
          if [ '${{ matrix.build }}' = native ]; then
            export RUSTFLAGS='-C target-cpu=native'
          fi
          if [ '${{ runner.os }}' = macOS ]; then
            test_args+=(--include-ignored)
          fi
          cargo test "${build_args[@]}" --all-features \
            --test parity_fixtures --test deseq_real_subset --test deseq_hard_real_subset \
            --test stress_oracles --test native_reference_precision --test deseq_airway \
            -- "${test_args[@]}"

  portable:
    name: Stable public API (${{ matrix.os }}, ${{ matrix.build }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
        build: [debug, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Both profiles and portable invariants
        shell: bash
        run: |
          build_args=()
          if [ '${{ matrix.build }}' = release ]; then
            build_args+=(--release)
          fi
          for feature_args in --no-default-features --all-features; do
            cargo test "${build_args[@]}" "$feature_args" --lib \
              --test arithmetic_profiles --test observers --test numerical_validity \
              --test line_search_oracles --test mixed_bound_oracles --test generated_quadratics \
              --test transformations --test validation_contract --test api_smoke \
              --test bounds --test finite_diff --test quadratic --test scaling
          done
      - name: Explicit profiles ignore feature unification
        if: matrix.build == 'debug'
        run: python3 scripts/check_profile_feature_invariance.py
      - name: Allocation and dimension growth on this platform
        if: matrix.build == 'release'
        shell: bash
        run: |
          measurements="$(mktemp)"
          LBFGSB_BENCH_SAMPLES=3 cargo bench --bench allocation_growth > "$measurements"
          python3 scripts/verify_measurements.py --after "$measurements"
          LBFGSB_API_SAMPLES=3 python3 scripts/measure_api_comparison.py

  evidence:
    name: Oracle and measurement integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Oracle recipe provenance and corrupted evidence rejection
        run: |
          python3 scripts/verify_oracles.py
          python3 scripts/test_verify_oracles.py
      - name: Recorded allocation and API comparisons
        run: |
          python3 scripts/verify_measurements.py
          python3 scripts/verify_api_measurements.py
          python3 scripts/test_verify_measurements.py

  msrv:
    name: Minimum supported Rust 1.87
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      - name: Public library and all feature combinations
        run: |
          cargo check --lib --no-default-features
          cargo check --all-targets --all-features
          cargo test --all-features --lib --test arithmetic_profiles --test observers \
            --test line_search_oracles --test mixed_bound_oracles --test generated_quadratics --test transformations \
            --test numerical_validity --test validation_contract --test api_smoke \
            --test bounds --test finite_diff --test quadratic --test scaling

  publish:
    name: Deploy to crates.io
    needs: [rust, reference, portable, evidence, msrv]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    environment:
      name: crates.io
      url: https://crates.io/crates/rcompat-lbfgsb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release tag
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}." >&2
            exit 1
          fi
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          : "${CARGO_REGISTRY_TOKEN:?Set the CARGO_REGISTRY_TOKEN repository secret to publish to crates.io.}"
          cargo publish --token "$CARGO_REGISTRY_TOKEN"
