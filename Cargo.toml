[package]
name = "rcompat-lbfgsb"
version = "0.2.2"
edition = "2021"
license = "MIT"
description = "Rust implementation of R-style stats::optim L-BFGS-B behavior "
readme = "README.md"
repository = "https://github.com/deminden/rcompat-lbfgsb"
categories = ["algorithms", "science"]
keywords = ["optimization", "lbfgsb", "r", "compatibility"]
exclude = ["external/**", "data/**", "target/**", ".codex-local/**", "Cargo.lock"]

[dependencies]

[features]
# R 4.6.1 macOS ARM / Clang contraction and Vortex short-dot arithmetic.
arm-fma = []

[[example]]
name = "deseq2"
required-features = ["arm-fma"]

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
